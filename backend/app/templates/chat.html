<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Assistant - RelyIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: oklch(0.18 0.02 260); --ink-soft: oklch(0.35 0.015 260); --ink-muted: oklch(0.52 0.01 260);
      --surface: oklch(0.97 0.005 80); --surface-raised: oklch(0.99 0.003 80); --surface-sunken: oklch(0.94 0.008 80);
      --brand: oklch(0.55 0.18 265); --brand-soft: oklch(0.92 0.04 265); --brand-text: oklch(0.42 0.16 265);
      --accent: oklch(0.65 0.15 145); --accent-soft: oklch(0.93 0.04 145);
      --warm: oklch(0.68 0.12 50); --warm-soft: oklch(0.94 0.03 50);
      --danger: oklch(0.55 0.2 25);
      --border: oklch(0.88 0.01 260); --border-light: oklch(0.92 0.005 260);
      --shadow-sm: 0 1px 2px oklch(0.18 0.02 260 / 0.04);
      --radius-sm: 6px; --radius-md: 12px; --radius-lg: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--ink); min-height: 100dvh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

    .site-header { position: sticky; top: 0; z-index: 50; background: color-mix(in oklch, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-light); padding: 0 clamp(16px, 4vw, 32px); height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
    .logo-mark { width: 28px; height: 28px; background: var(--brand); border-radius: 7px; display: grid; place-items: center; color: white; font-weight: 600; font-size: 13px; }
    .logo-text { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; letter-spacing: -0.03em; }
    .header-nav { display: flex; align-items: center; gap: 4px; }
    .header-nav a, .header-nav button { font-family: inherit; font-size: 13px; font-weight: 500; color: var(--ink-muted); text-decoration: none; padding: 7px 12px; border-radius: var(--radius-sm); transition: all 0.15s; background: none; border: none; cursor: pointer; }
    .header-nav a:hover, .header-nav button:hover { color: var(--ink); background: var(--surface-sunken); }
    .header-nav .btn-new-chat { color: var(--brand-text); background: var(--brand-soft); }
    .header-nav .btn-new-chat:hover { background: oklch(0.88 0.06 265); }
    .header-nav .btn-signout:hover { color: var(--danger); background: none; }

    .chat-viewport { flex: 1; display: flex; flex-direction: column; max-width: 720px; width: 100%; margin: 0 auto; padding: clamp(16px, 3vw, 32px) clamp(16px, 4vw, 24px); }
    .chat-stream { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-bottom: 24px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .msg-row { display: flex; gap: 12px; opacity: 0; transform: translateY(12px); animation: msg-enter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .msg-row.user { flex-direction: row-reverse; }
    @keyframes msg-enter { to { opacity: 1; transform: translateY(0); } }
    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
    .msg-avatar.ai { background: var(--brand-soft); color: var(--brand-text); }
    .msg-avatar.human { background: var(--warm-soft); color: var(--warm); }
    .msg-body { max-width: 88%; min-width: 0; }

    .card-welcome { background: var(--surface-raised); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: clamp(20px, 3vw, 28px); box-shadow: var(--shadow-sm); }
    .card-welcome h2 { font-family: 'Fraunces', serif; font-size: clamp(20px, 2.5vw, 26px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 8px; }
    .card-welcome p { font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .action-pill { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 100px; font-size: 13px; font-weight: 450; color: var(--ink-soft); cursor: pointer; transition: border-color 0.15s, color 0.15s, transform 0.1s, box-shadow 0.15s; font-family: inherit; }
    .action-pill:hover { border-color: var(--brand); color: var(--brand-text); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .action-pill:active { transform: translateY(0); }
    .card-text { background: var(--surface-raised); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: clamp(16px, 2.5vw, 22px); box-shadow: var(--shadow-sm); }
    .card-text p { font-size: 14px; line-height: 1.7; color: var(--ink-soft); }
    .card-text strong { color: var(--ink); font-weight: 600; }
    .card-text .source-cite { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 4px 10px; background: var(--accent-soft); border-radius: 100px; font-size: 11px; font-weight: 500; color: oklch(0.38 0.1 145); }
    .card-user { background: var(--ink); color: var(--surface); border-radius: var(--radius-lg); padding: 14px 18px; font-size: 14px; line-height: 1.5; margin-left: auto; max-width: 75%; }
    .typing-dots { display: inline-flex; gap: 4px; padding: 14px 18px; background: var(--surface-raised); border: 1px solid var(--border-light); border-radius: var(--radius-lg); }
    .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-muted); animation: dot-pulse 1.2s ease-in-out infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dot-pulse { 0%, 60%, 100% { opacity: 0.3; transform: scale(0.85); } 30% { opacity: 1; transform: scale(1); } }

    .chat-input-area { padding-top: 16px; border-top: 1px solid var(--border-light); margin-top: auto; }
    .input-wrapper { display: flex; align-items: flex-end; gap: 10px; background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 6px 6px 6px 18px; transition: border-color 0.2s, box-shadow 0.2s; }
    .input-wrapper:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px oklch(0.55 0.18 265 / 0.08); }
    .input-wrapper textarea { flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; color: var(--ink); resize: none; padding: 10px 0; line-height: 1.5; min-height: 20px; max-height: 120px; }
    .input-wrapper textarea::placeholder { color: var(--ink-muted); }
    .send-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--brand); color: white; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 2px 6px oklch(0.55 0.18 265 / 0.2); }
    .send-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px oklch(0.55 0.18 265 / 0.25); }
    .send-btn:active { transform: scale(0.92); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    /* History panel */
    .history-panel { position: fixed; inset: 0; z-index: 80; display: flex; opacity: 0; pointer-events: none; transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .history-panel.open { opacity: 1; pointer-events: all; }
    .history-backdrop { position: absolute; inset: 0; background: oklch(0.18 0.02 260 / 0.3); }
    .history-drawer { position: relative; width: 320px; max-width: 85vw; background: var(--surface); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; transform: translateX(-20px); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .history-panel.open .history-drawer { transform: translateX(0); }
    .history-header { padding: 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
    .history-header h3 { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
    .history-close { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--surface-sunken); color: var(--ink-muted); cursor: pointer; display: grid; place-items: center; font-size: 16px; transition: background 0.15s; }
    .history-close:hover { background: var(--border); color: var(--ink); }
    .history-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .history-item { padding: 12px 14px; border-radius: var(--radius-md); cursor: pointer; transition: background 0.1s; display: flex; flex-direction: column; gap: 4px; }
    .history-item:hover { background: var(--surface-sunken); }
    .history-item.active { background: var(--brand-soft); }
    .history-item .history-title { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item .history-meta { font-size: 11px; color: var(--ink-muted); }
    .history-empty { padding: 40px 20px; text-align: center; font-size: 13px; color: var(--ink-muted); line-height: 1.6; }

    /* Login overlay */
    .login-overlay { position: fixed; inset: 0; background: var(--surface); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-overlay.hidden { display: none; }
    .login-box { width: 100%; max-width: 360px; }
    .login-box h2 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 20px; }
    .login-box form { display: flex; flex-direction: column; gap: 12px; }
    .login-box input { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: inherit; font-size: 14px; outline: none; background: var(--surface-raised); }
    .login-box input:focus { border-color: var(--brand); }
    .login-box button { padding: 12px; background: var(--brand); color: white; border: none; border-radius: var(--radius-md); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
    .login-box .error { font-size: 12px; color: var(--danger); text-align: center; min-height: 18px; }
  </style>
</head>
<body>
  <div class="login-overlay" id="login-screen">
    <div class="login-box">
      <div style="text-align:center; margin-bottom: 16px;"><a href="/" class="logo" style="display:inline-flex;"><div class="logo-mark">R</div><span class="logo-text">RelyIQ</span></a></div>
      <h2>Sign in to chat</h2>
      <form id="login-form">
        <input type="email" id="username" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Sign in</button>
        <div class="error" id="login-error"></div>
      </form>
    </div>
  </div>

  <header class="site-header">
    <a href="/" class="logo"><div class="logo-mark">R</div><span class="logo-text">RelyIQ</span></a>
    <nav class="header-nav">
      <button onclick="newChat()" class="btn-new-chat">+ New chat</button>
      <button onclick="toggleHistory()">History</button>
      <a href="#" id="manage-link">Dashboard</a>
      <button id="logout-btn" class="btn-signout">Sign out</button>
    </nav>
  </header>

  <!-- History panel -->
  <div class="history-panel" id="history-panel" onclick="if(event.target===this||event.target.classList.contains('history-backdrop'))closeHistory()">
    <div class="history-backdrop"></div>
    <div class="history-drawer">
      <div class="history-header">
        <h3>Chat history</h3>
        <button class="history-close" onclick="closeHistory()">×</button>
      </div>
      <div class="history-list" id="history-list">
        <div class="history-empty">No conversations yet.<br>Start chatting to build your history.</div>
      </div>
    </div>
  </div>

  <div class="chat-viewport">
    <div class="chat-stream" id="chat-stream"></div>
    <div class="chat-input-area">
      <div class="input-wrapper">
        <textarea id="question" rows="1" placeholder="Ask a question..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ask();}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';"></textarea>
        <button class="send-btn" id="ask-btn" onclick="ask()">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5L12 3m0 0l7.5 7.5M12 3v18"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let jwt = localStorage.getItem('jwt_token');
    let tenant = localStorage.getItem('tenant_slug') || 'default';
    let isLoading = false;
    const stream = document.getElementById('chat-stream');
    const input = document.getElementById('question');
    const manageLink = document.getElementById('manage-link');

    // ─── Chat History Management ─────────────────────────────────────────
    let conversations = JSON.parse(localStorage.getItem('chat_conversations') || '[]');
    let currentConvoId = null;

    function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    function saveConversations() {
      localStorage.setItem('chat_conversations', JSON.stringify(conversations));
    }

    function getCurrentConvo() {
      return conversations.find(c => c.id === currentConvoId);
    }

    function startNewConversation() {
      const convo = { id: generateId(), title: 'New conversation', messages: [], created: Date.now(), updated: Date.now() };
      conversations.unshift(convo);
      currentConvoId = convo.id;
      saveConversations();
      return convo;
    }

    function addMessageToConvo(role, text) {
      const convo = getCurrentConvo();
      if (!convo) return;
      convo.messages.push({ role, text, ts: Date.now() });
      convo.updated = Date.now();
      // Update title from first user message
      if (role === 'user' && convo.messages.filter(m => m.role === 'user').length === 1) {
        convo.title = text.length > 50 ? text.slice(0, 50) + '...' : text;
      }
      saveConversations();
    }

    function newChat() {
      startNewConversation();
      showWelcome();
      renderHistoryList();
      input.focus();
    }

    function loadConversation(id) {
      currentConvoId = id;
      const convo = getCurrentConvo();
      if (!convo) return;
      stream.innerHTML = '';
      convo.messages.forEach(msg => {
        if (msg.role === 'user') {
          const row = document.createElement('div'); row.className = 'msg-row user'; row.style.opacity = '1'; row.style.transform = 'none'; row.style.animation = 'none';
          row.innerHTML = `<div class="msg-avatar human">Y</div><div class="msg-body"><div class="card-user">${escapeHtml(msg.text)}</div></div>`;
          stream.appendChild(row);
        } else {
          const row = document.createElement('div'); row.className = 'msg-row'; row.style.opacity = '1'; row.style.transform = 'none'; row.style.animation = 'none';
          row.innerHTML = `<div class="msg-avatar ai">R</div><div class="msg-body"><div class="card-text"><p>${msg.text.replace(/\n/g,'<br>')}</p></div></div>`;
          stream.appendChild(row);
        }
      });
      stream.scrollTop = stream.scrollHeight;
      closeHistory();
      renderHistoryList();
    }

    function deleteConversation(id, e) {
      e.stopPropagation();
      conversations = conversations.filter(c => c.id !== id);
      saveConversations();
      if (currentConvoId === id) { newChat(); }
      renderHistoryList();
    }

    function renderHistoryList() {
      const list = document.getElementById('history-list');
      if (conversations.length === 0) {
        list.innerHTML = '<div class="history-empty">No conversations yet.<br>Start chatting to build your history.</div>';
        return;
      }
      list.innerHTML = conversations.map(c => {
        const date = new Date(c.updated);
        const timeStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const msgCount = c.messages.length;
        const isActive = c.id === currentConvoId ? ' active' : '';
        return `<div class="history-item${isActive}" onclick="loadConversation('${c.id}')">
          <span class="history-title">${escapeHtml(c.title)}</span>
          <span class="history-meta">${timeStr} · ${msgCount} message${msgCount !== 1 ? 's' : ''}</span>
        </div>`;
      }).join('');
    }

    function toggleHistory() { document.getElementById('history-panel').classList.toggle('open'); renderHistoryList(); }
    function closeHistory() { document.getElementById('history-panel').classList.remove('open'); }

    // ─── Auth & Init ─────────────────────────────────────────────────────
    function checkAuth() {
      const overlay = document.getElementById('login-screen');
      if (!jwt) { overlay.classList.remove('hidden'); } else {
        overlay.classList.add('hidden');
        manageLink.href = `/${tenant}/dashboard`;
        // Load last conversation or start new
        if (conversations.length > 0 && conversations[0].messages.length > 0) {
          currentConvoId = conversations[0].id;
          loadConversation(currentConvoId);
        } else {
          startNewConversation();
          showWelcome();
        }
        renderHistoryList();
      }
    }

    function showWelcome() {
      stream.innerHTML = '';
      const row = document.createElement('div'); row.className = 'msg-row';
      row.innerHTML = `<div class="msg-avatar ai">R</div><div class="msg-body"><div class="card-welcome"><h2>Ask me anything about your policies</h2><p>I'll search your knowledge base and cite the exact section. Try one of these:</p></div></div>`;
      stream.appendChild(row);
      setTimeout(() => {
        const pills = document.createElement('div'); pills.className = 'msg-row'; pills.style.animation = 'msg-enter 0.4s cubic-bezier(0.16,1,0.3,1) 0.3s forwards'; pills.style.opacity = '0';
        pills.innerHTML = `<div class="msg-avatar ai" style="visibility:hidden">R</div><div class="msg-body"><div class="card-actions"><button class="action-pill" onclick="askQ('How much PTO do I get?')">🏖️ PTO policy</button><button class="action-pill" onclick="askQ('Remote work policy?')">💻 Remote work</button><button class="action-pill" onclick="askQ('What expenses can I claim?')">📡 Expenses</button></div></div>`;
        stream.appendChild(pills);
      }, 100);
    }

    function askQ(q) { input.value = q; ask(); }
    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    async function ask() {
      const q = input.value.trim(); if (!q || isLoading) return;
      isLoading = true; input.value = ''; input.style.height = 'auto';
      document.getElementById('ask-btn').disabled = true;

      // Ensure we have a conversation
      if (!currentConvoId) startNewConversation();
      addMessageToConvo('user', q);

      const uRow = document.createElement('div'); uRow.className = 'msg-row user'; uRow.style.animation = 'msg-enter 0.3s cubic-bezier(0.16,1,0.3,1) forwards';
      uRow.innerHTML = `<div class="msg-avatar human">Y</div><div class="msg-body"><div class="card-user">${escapeHtml(q)}</div></div>`;
      stream.appendChild(uRow); stream.scrollTop = stream.scrollHeight;

      const tRow = document.createElement('div'); tRow.className = 'msg-row'; tRow.id = 'typing'; tRow.style.animation = 'msg-enter 0.3s cubic-bezier(0.16,1,0.3,1) forwards';
      tRow.innerHTML = `<div class="msg-avatar ai">R</div><div class="msg-body"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
      stream.appendChild(tRow); stream.scrollTop = stream.scrollHeight;

      try {
        const res = await fetch(`/${tenant}/chat/ask`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${jwt}` }, body: JSON.stringify({ question: q }) });
        document.getElementById('typing')?.remove();
        if (res.status === 401) { jwt = null; localStorage.removeItem('jwt_token'); checkAuth(); return; }
        const data = res.ok ? await res.json() : null;
        const answer = data?.answer || 'Could not get an answer. Try again.';
        const source = data?.sources?.[0]?.title || null;

        addMessageToConvo('ai', answer);
        renderHistoryList();

        const aRow = document.createElement('div'); aRow.className = 'msg-row'; aRow.style.animation = 'msg-enter 0.4s cubic-bezier(0.16,1,0.3,1) forwards';
        aRow.innerHTML = `<div class="msg-avatar ai">R</div><div class="msg-body"><div class="card-text"><p>${answer.replace(/\n/g,'<br>')}</p>${source ? `<div class="source-cite">📄 ${escapeHtml(source)}</div>` : ''}</div></div>`;
        stream.appendChild(aRow);
        // Show contextual follow-ups from AI
        const followUps = data?.follow_ups || [];
        if (followUps.length > 0) {
          const fRow = document.createElement('div'); fRow.className = 'msg-row'; fRow.style.animation = 'msg-enter 0.3s cubic-bezier(0.16,1,0.3,1) 0.1s forwards'; fRow.style.opacity = '0';
          fRow.innerHTML = `<div class="msg-avatar ai" style="visibility:hidden">R</div><div class="msg-body"><div class="card-actions">${followUps.map(s => `<button class="action-pill" onclick="askQ('${escapeHtml(s)}')">${escapeHtml(s)}</button>`).join('')}</div></div>`;
          stream.appendChild(fRow);
        }
      } catch { document.getElementById('typing')?.remove(); }
      stream.scrollTop = stream.scrollHeight;
      isLoading = false; document.getElementById('ask-btn').disabled = false; input.focus();
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        if (!res.ok) { document.getElementById('login-error').textContent = 'Invalid credentials'; return; }
        const data = await res.json();
        jwt = data.access_token; tenant = data.tenant_slug || 'default';
        localStorage.setItem('jwt_token', jwt); localStorage.setItem('tenant_slug', tenant);
        checkAuth();
      } catch { document.getElementById('login-error').textContent = 'Connection error'; }
    });

    document.getElementById('logout-btn').addEventListener('click', () => { jwt = null; localStorage.removeItem('jwt_token'); localStorage.removeItem('tenant_slug'); stream.innerHTML = ''; checkAuth(); });

    // Keyboard shortcut: Ctrl/Cmd+Shift+N for new chat
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'N') { e.preventDefault(); newChat(); }
      if (e.key === 'Escape') closeHistory();
    });

    checkAuth();
  </script>
</body>
</html>
