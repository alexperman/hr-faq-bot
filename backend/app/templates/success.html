<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3;url=/">
  <title>You're set — RelyIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: oklch(0.18 0.02 260); --ink-soft: oklch(0.35 0.015 260); --ink-muted: oklch(0.52 0.01 260); --surface: oklch(0.97 0.005 80); --brand: oklch(0.55 0.18 265); --accent: oklch(0.65 0.15 145); --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--ink); min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }
    .content { text-align: center; max-width: 400px; opacity: 0; transform: translateY(16px) scale(0.97); animation: pop-in 0.6s var(--ease-out-expo) 0.1s forwards; }
    @keyframes pop-in { to { opacity: 1; transform: translateY(0) scale(1); } }
    .check { width: 56px; height: 56px; border-radius: 50%; background: oklch(0.93 0.04 145); display: grid; place-items: center; margin: 0 auto 20px; }
    .check svg { width: 28px; height: 28px; color: var(--accent); }
    h1 { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 10px; }
    p { font-size: 15px; line-height: 1.6; color: var(--ink-soft); }
    .redirect { margin-top: 32px; font-size: 12px; color: var(--ink-muted); }
    @media (prefers-reduced-motion: reduce) { .content { animation: none; opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="content">
    <div class="check"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>
    <h1>You're all set</h1>
    <p>Check your inbox — your free HR Automation Readiness Assessment arrives within 24 hours.</p>
    <div class="redirect">Redirecting to home...</div>
  </div>
</body>
</html>
