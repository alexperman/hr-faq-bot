<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — RelyIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: oklch(0.18 0.02 260); --ink-soft: oklch(0.35 0.015 260); --ink-muted: oklch(0.52 0.01 260);
      --surface: oklch(0.97 0.005 80); --surface-raised: oklch(0.99 0.003 80); --surface-sunken: oklch(0.94 0.008 80);
      --brand: oklch(0.55 0.18 265); --brand-soft: oklch(0.92 0.04 265); --brand-text: oklch(0.42 0.16 265);
      --accent: oklch(0.65 0.15 145); --accent-soft: oklch(0.93 0.04 145);
      --danger: oklch(0.55 0.2 25); --danger-soft: oklch(0.93 0.04 25);
      --border: oklch(0.88 0.01 260); --border-light: oklch(0.92 0.005 260);
      --shadow-sm: 0 1px 2px oklch(0.18 0.02 260 / 0.04);
      --radius-sm: 6px; --radius-md: 12px; --radius-lg: 20px;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--ink); min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }

    .auth-container { width: 100%; max-width: 380px; opacity: 0; transform: translateY(16px); animation: page-in 0.6s var(--ease-out-expo) 0.1s forwards; }
    @keyframes page-in { to { opacity: 1; transform: translateY(0); } }

    .logo-area { text-align: center; margin-bottom: 32px; }
    .logo-area a { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
    .logo-mark { width: 32px; height: 32px; background: var(--brand); border-radius: 8px; display: grid; place-items: center; color: white; font-weight: 600; font-size: 14px; }
    .logo-text { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; letter-spacing: -0.03em; }

    .auth-title { font-family: 'Fraunces', serif; font-size: clamp(24px, 3vw, 30px); font-weight: 600; letter-spacing: -0.03em; text-align: center; margin-bottom: 6px; }
    .auth-subtitle { font-size: 14px; color: var(--ink-muted); text-align: center; margin-bottom: 28px; }

    .tabs { display: flex; background: var(--surface-sunken); border-radius: var(--radius-md); padding: 4px; margin-bottom: 24px; }
    .tab { flex: 1; padding: 10px; border: none; background: none; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--ink-muted); cursor: pointer; border-radius: 8px; transition: all 0.2s var(--ease-out-expo); }
    .tab.active { background: var(--surface-raised); color: var(--ink); box-shadow: var(--shadow-sm); }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-family: inherit; font-size: 14px; color: var(--ink); background: var(--surface-raised); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .form-group input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px oklch(0.55 0.18 265 / 0.08); }
    .form-group input::placeholder { color: oklch(0.62 0.005 260); }

    .submit-btn { width: 100%; padding: 13px; border: none; border-radius: var(--radius-md); background: var(--brand); color: white; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; margin-top: 4px; }
    .submit-btn:hover { opacity: 0.88; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .error-msg { background: var(--danger-soft); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 16px; display: none; animation: shake 0.4s var(--ease-out-expo); }
    .error-msg.visible { display: block; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

    .switch-text { text-align: center; font-size: 13px; color: var(--ink-muted); margin-top: 20px; }
    .switch-text a { color: var(--brand-text); font-weight: 500; cursor: pointer; text-decoration: none; }
    .switch-text a:hover { text-decoration: underline; }

    .back-link { text-align: center; margin-top: 24px; font-size: 13px; }
    .back-link a { color: var(--ink-muted); text-decoration: none; }
    .back-link a:hover { color: var(--ink); }

    .form-section { display: none; }
    .form-section.active { display: block; }

    @media (prefers-reduced-motion: reduce) { .auth-container { animation: none; opacity: 1; transform: none; } .error-msg { animation: none; } }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="logo-area"><a href="/"><div class="logo-mark">R</div><span class="logo-text">RelyIQ</span></a></div>
    <h1 class="auth-title" id="title">Welcome back</h1>
    <p class="auth-subtitle" id="subtitle">Sign in to your HR assistant</p>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign in</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Create account</button>
    </div>

    <div class="error-msg" id="error"></div>

    <div class="form-section active" id="section-login">
      <form id="login-form">
        <div class="form-group"><label for="login-email">Email</label><input type="email" id="login-email" placeholder="you@company.com" required></div>
        <div class="form-group"><label for="login-pass">Password</label><input type="password" id="login-pass" placeholder="Your password" required></div>
        <button type="submit" class="submit-btn" id="login-btn">Sign in</button>
      </form>
    </div>

    <div class="form-section" id="section-register">
      <form id="register-form">
        <div class="form-group"><label for="reg-name">Full name</label><input type="text" id="reg-name" placeholder="Jane Smith" required></div>
        <div class="form-group"><label for="reg-email">Email</label><input type="email" id="reg-email" placeholder="you@company.com" required></div>
        <div class="form-group"><label for="reg-pass">Password</label><input type="password" id="reg-pass" placeholder="8+ characters" required minlength="8"></div>
        <div class="form-group"><label for="reg-company">Company name</label><input type="text" id="reg-company" placeholder="Acme Corp" required></div>
        <button type="submit" class="submit-btn" id="reg-btn">Create account</button>
      </form>
    </div>

    <div class="switch-text" id="switch">Don't have an account? <a onclick="switchTab('register')">Register</a></div>
    <div class="back-link"><a href="/">← Back to home</a></div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('section-login').classList.toggle('active', tab === 'login');
      document.getElementById('section-register').classList.toggle('active', tab === 'register');
      document.getElementById('title').textContent = tab === 'login' ? 'Welcome back' : 'Create your account';
      document.getElementById('subtitle').textContent = tab === 'login' ? 'Sign in to your HR assistant' : 'Get started with RelyIQ';
      document.getElementById('switch').innerHTML = tab === 'login'
        ? 'Don\'t have an account? <a onclick="switchTab(\'register\')">Register</a>'
        : 'Already have an account? <a onclick="switchTab(\'login\')">Sign in</a>';
      hideError();
    }

    function showError(msg) { const el = document.getElementById('error'); el.textContent = msg; el.classList.add('visible'); }
    function hideError() { document.getElementById('error').classList.remove('visible'); }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault(); hideError();
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Signing in...';
      try {
        const res = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('login-email').value, password: document.getElementById('login-pass').value }) });
        const data = await res.json().catch(() => null);
        if (!res.ok) throw new Error(data?.detail || data?.error?.message || 'Invalid credentials');
        localStorage.setItem('jwt_token', data.access_token);
        localStorage.setItem('tenant_slug', data.tenant_slug || 'default');
        window.location.href = `/${data.tenant_slug || 'default'}/dashboard`;
      } catch (err) { showError(err.message); }
      btn.disabled = false; btn.textContent = 'Sign in';
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault(); hideError();
      const btn = document.getElementById('reg-btn');
      btn.disabled = true; btn.textContent = 'Creating...';
      try {
        const res = await fetch('/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ full_name: document.getElementById('reg-name').value, email: document.getElementById('reg-email').value, password: document.getElementById('reg-pass').value, company_name: document.getElementById('reg-company').value }) });
        const data = await res.json().catch(() => null);
        if (!res.ok) throw new Error(data?.detail || data?.error?.message || 'Registration failed');
        localStorage.setItem('jwt_token', data.access_token);
        localStorage.setItem('tenant_slug', data.tenant_slug || 'default');
        window.location.href = `/${data.tenant_slug || 'default'}/dashboard`;
      } catch (err) { showError(err.message); }
      btn.disabled = false; btn.textContent = 'Create account';
    });
  </script>
</body>
</html>
